[package]
name        = "i2c-devices-nv"
version     = "0.1.0"
description = "Drivers for the I2C parts a battery-powered sensor node carries: the BME280 environment sensor with the datasheet's compensation arithmetic, the SHT3x humidity sensor with the CRC every reply carries, the BH1750 light sensor and the INA219 current monitor.  One bus trait, implemented for a board's I2C bus, a conversion time answered rather than slept through, and every register named with its datasheet section."
license     = "Apache-2.0"

stability   = "experimental"

# `host`.  `i2cboard` implements `I2cDeviceBus[hw]` for embedded-hal-nv's
# `BoardI2c`, which is `[hw]` and which a `core` package may not
# depend on.
#
# Most of the package is arithmetic over words a caller already holds:
# the BME280's compensation coefficients and the two polynomials they
# feed, the SHT3x's CRC, the INA219's calibration divisor, and the
# register constants themselves.  None of that touches a bus, and every
# module but `i2cboard` and `i2cfault` is written for the embedded tier.
# `tests/embedded_probe.nv` builds that arithmetic for a Cortex-M.
#
# The functions that talk to a part are written over `I2cDeviceBus[e]`
# and declare `[e]`, the effect the implementation behind the bus
# supplies: `[hw]` for a peripheral on a microcontroller and `[]` for a
# table of recorded bytes in a test (SPEC § 5.6).
layer       = "host"

category    = "embedded"

tags        = ["i2c", "sensor", "driver", "bme280", "sht3x", "bh1750", "ina219",
               "embedded", "embedded-hal", "no-alloc"]
repository  = "https://github.com/novolang/i2c-devices-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.22.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A conversion time is a number the caller waits, not a sleep the driver hides"

[dependencies]
# `BoardI2c`, the handle `i2cboard` wraps, and the `I2cBus` trait it is
# driven through.
embedded-hal-nv = "^0.2.1"
#
# Two packages are left out on purpose.
#
# crc-nv.  The SHT3x checks every two bytes with CRC-8, polynomial
# 0x31, initial value 0xff, no reflection and no final xor.  crc-nv
# publishes four algorithms — CRC-16/CCITT-FALSE, CRC-16/MODBUS, CRC-32
# and CRC-32C — and none of them is eight bits wide; its `Crc` value
# also owns a 256-entry table as a `[Int]`, which is a heap allocation
# and a quarter-kilobyte for a check over three bytes.  `sht3x.crc8`
# computes the same number bit by bit in twenty-four iterations.  The
# README names the width crc-nv would need.
#
# The heapless collections.  Nothing here is a collection: a reading is a
# `@value` struct of integers and a register write is two bytes on the
# caller's stack.
